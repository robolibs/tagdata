[package]
name = "inspace"
version = "0.1.0"
edition = "2024"
description = "inspace"
license = "MIT"
readme = "README.md"
repository = "https://github.com/robolibs/inspace"
homepage = "https://github.com/robolibs/inspace"
documentation = "https://docs.rs/inspace"
keywords = ["database", "embedded", "mmap", "key-value", "transactions"]
categories = ["database-implementations", "data-structures"]
rust-version = "1.85"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
test-hooks = []
typed = []
serde-codec = ["typed", "dep:rmp-serde", "dep:serde"]

[dependencies]
libc = "0.2.149"
memmap2 = "0.9.11"
page_size = "0.6.0"
fs4 = "0.7.0"
bytes = "1.5.0"
bumpalo = "3.14.0"
fnv = "1.0.7"
sha3 = "0.10.8"
rmp-serde = { version = "1.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
bytes = { version = "1", features = ["serde"] }
rand = "0.8"
rmp-serde = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
