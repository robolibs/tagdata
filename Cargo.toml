[package]
name = "tagdata"
version = "0.1.2"
edition = "2024"
description = "tagdata"
license = "MIT"
readme = "README.md"
repository = "https://github.com/robolibs/tagdata"
homepage = "https://github.com/robolibs/tagdata"
documentation = "https://docs.rs/tagdata"
keywords = ["database", "embedded", "mmap", "key-value", "transactions"]
categories = ["database-implementations", "data-structures"]
rust-version = "1.89"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tagdata"
path = "src/bin/tagdata.rs"
required-features = ["operator"]

[[example]]
name = "benchmark_typed_reads"
required-features = ["typed"]

[features]
default = []
bytes-interop = ["dep:bytes"]
changefeed = []
maintenance = []
operator = ["maintenance"]
test-hooks = []
typed = []
serde-codec = ["typed", "dep:rmp-serde", "dep:serde"]

[dependencies]
libc = "0.2.149"
memmap2 = "0.9.11"
page_size = "0.6.0"
bytes = { version = "1.5.0", optional = true }
bumpalo = "3.14.0"
sha3 = { version = "0.10.8", default-features = false }
rmp-serde = { version = "1.1", optional = true }
serde = { version = "1.0", optional = true }

[dev-dependencies]
bytes = { version = "1", features = ["serde"] }
fnv = "1"
jammdb = "=0.11.0"
rand = "0.8"
rmp-serde = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

[profile.size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
